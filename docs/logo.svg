  <!-- </> code chevrons inside the counter -->
  <g stroke="#e9ebf5" stroke-width="16" stroke-linecap="round" stroke-opacity="0.92" fill="none">
    <path d="M 252 216 L 224 256 L 252 296"/>
    <path d="M 284 212 L 316 300"/>
    <path d="M 336 216 L 364 256 L 336 296"/>
  </g>
</svg>
