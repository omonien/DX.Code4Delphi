<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262a40"/>
      <stop offset="1" stop-color="#13151d"/>
    </linearGradient>
    <linearGradient id="dgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff444c"/>
      <stop offset="1" stop-color="#d2121a"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>

  <!-- D: vertical bar -->
  <rect x="150" y="118" width="72" height="276" rx="36" fill="url(#dgrad)"/>

  <!-- D: annular right arc (outer 152 / inner 80) -->
