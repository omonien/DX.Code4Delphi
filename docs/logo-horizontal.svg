<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" width="1024" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#12141c"/>
    </linearGradient>
    <linearGradient id="helm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38cbf5"/>
      <stop offset="0.55" stop-color="#01a3da"/>
      <stop offset="1" stop-color="#04648f"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd4fb"/>
      <stop offset="1" stop-color="#0e86b5"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="1008" height="240" rx="40" fill="url(#bg)"/>

  <!-- helmet mark -->
  <g transform="translate(72, 40) scale(0.42)">
    <path d="M 402 124 C 404 56, 300 26, 198 96"
          fill="none" stroke="url(#plume)" stroke-width="40" stroke-linecap="round"/>
    <rect x="150" y="104" width="72" height="304" rx="36" fill="url(#helm)"/>
    <path d="M 222 104 A 152 152 0 0 1 222 408 Z" fill="url(#helm)"/>
    <path d="M 334 236
             C 372 226, 398 248, 388 274
             C 380 292, 356 294, 348 284
             C 366 272, 368 252, 334 236 Z"
          fill="#0b1220"/>
    <path d="M 250 120
             C 330 116, 392 140, 424 180
             C 386 138, 316 112, 250 120 Z"
          fill="#7fe1ff" fill-opacity="0.35"/>
  </g>

  <!-- wordmark -->
  <text x="312" y="142" font-family="Helvetica, Arial, sans-serif" font-size="96"
        font-weight="bold" fill="#01a3da" letter-spacing="3">DELPHI</text>
  <text x="316" y="196" font-family="Helvetica, Arial, sans-serif" font-size="30"
        fill="#aab3c5" letter-spacing="1">by Developer Experts</text>
  <text x="316" y="226" font-family="Helvetica, Arial, sans-serif" font-size="19"
        fill="#7d8698">www.developer-experts.net</text>
</svg>
